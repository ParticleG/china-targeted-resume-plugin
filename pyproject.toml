[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "china-targeted-resume"
version = "0.1.0"
description = "Build evidence-grounded resumes targeted to roles in China."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "jinja2>=3.1,<4",
  "markdown-it-py>=4,<5",
  "playwright>=1.55,<2",
  "pydantic>=2.11,<3",
  "pymupdf>=1.26,<2",
]

[project.scripts]
china-targeted-resume = "china_targeted_resume.cli:main"

[dependency-groups]
dev = [
  "coverage[toml]>=7.10,<8",
  "jsonschema>=4.25,<5",
  "pytest>=8.4,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/china_targeted_resume"]

[tool.hatch.build.targets.wheel.force-include]
assets = "assets"
"schemas/approved-claims.schema.json" = "china_targeted_resume/schemas/approved-claims.schema.json"
"schemas/normalized-evidence-input.schema.json" = "china_targeted_resume/schemas/normalized-evidence-input.schema.json"
"schemas/normalized-role-input.schema.json" = "china_targeted_resume/schemas/normalized-role-input.schema.json"
"schemas/review-decision.schema.json" = "china_targeted_resume/schemas/review-decision.schema.json"
"schemas/source-map.schema.json" = "china_targeted_resume/schemas/source-map.schema.json"

[tool.hatch.build.targets.sdist]
include = [
  "/skills/china-targeted-resume",
  "/README.md",
  "/assets",
  "/pyproject.toml",
  "/schemas",
  "/scripts",
  "/src",
  "/uv.lock",
]
